---
# tasks file for roles/docker

- name: Install required packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Detect Debian package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: debian_arch
  changed_when: false

- name: Configure Docker APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: {{ debian_arch.stdout }}
      Signed-By: /etc/apt/keyrings/docker.asc
  register: docker_repository

- name: Refresh APT cache when repository changes
  ansible.builtin.apt:
    update_cache: true
  when: docker_repository.changed

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Install Docker SDK in a Python virtual environment
  ansible.builtin.pip:
    name: docker
    virtualenv: /opt/docker_venv
    virtualenv_command: python3 -m venv

- name: Ensure Docker service is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  tags: docker
