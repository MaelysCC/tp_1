---
# tasks file for roles/proxy

- name: Run HTTPD reverse proxy
  community.docker.docker_container:
    name: httpd
    image: "{{ proxy_image }}"
    pull: always
    state: started
    restart_policy: unless-stopped
    networks:
      - name: app-network
    published_ports:
      - "80:80"
