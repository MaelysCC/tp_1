name: CI devops 2025
on:
  #to begin you want to launch this job in main and develop
  # Run every time something is pushed on the following branches
  push:
    branches:
      - main
      - develop
  # Run every time the code is merged
  pull_request:

jobs:
  test-backend:
    # The virtual machine provided by github
    runs-on: ubuntu-24.04
    steps:
      #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

      #download JDK 21 needed to compile the application
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'



      #finally build your app with the latest command
      - name: Build and test with Maven
        run: mvn clean verify
        working-directory: './simple-api'
