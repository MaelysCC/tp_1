name: CI devops 2025

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:

  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test with Maven
        run: mvn clean verify --file backend/simpleapi/pom.xml
#sonar:sonar marche pas ->No plugin found for prefix 'sonar'
      
      - name: SonarCloud analysis
        working-directory: ./backend/simpleapi
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=MaelysCC_tp_1 \
            -Dsonar.organization=maelyscc \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN"



  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/simpleapi
          tags: maelyscc/simpleapi:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./Database
          tags: maelyscc/postgres-db:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./httpd
          tags: maelyscc/httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}
  
  deploy:
    name: Deploy on Takima
    needs: build-and-push-docker-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python3 -m venv /tmp/ansible-venv
          /tmp/ansible-venv/bin/pip install ansible
          /tmp/ansible-venv/bin/ansible-galaxy collection install community.docker

      
      
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_rsa"
          sed -i 's/\r$//' "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

          printf '%s\n' \
            'maelys.de-crouy-chanel.takima.school ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIECEH6XFgnrRDEAVWwiZizKPoGYZXBxRW0QfJc5Go4GN' \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify known hosts
        run: |
          echo "Checking known_hosts:"
          ssh-keygen -F maelys.de-crouy-chanel.takima.school \
            -f "$HOME/.ssh/known_hosts"

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -i "$HOME/.ssh/id_rsa" \
              admin@maelys.de-crouy-chanel.takima.school \
              "echo SSH connection successful"


      - name: Deploy with Ansible
        working-directory: ./ansible
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$VAULT_PASSWORD" > /tmp/vault_pass
          chmod 600 /tmp/vault_pass

          /tmp/ansible-venv/bin/ansible-playbook \
            -i inventories/setup.yml \
            playbook.yml \
            -e "ansible_ssh_private_key_file=$HOME/.ssh/id_rsa" \
            --vault-password-file /tmp/vault_pass

      - name: Clean up credentials
        if: always()
        run: rm -f ~/.ssh/id_rsa /tmp/vault_pass

